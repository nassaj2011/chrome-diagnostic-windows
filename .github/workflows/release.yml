name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build and test
        shell: powershell
        run: .\tools\build.ps1
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/ChromeDiagnostic.exe
            dist/Chrome-Diagnostic-Setup-*.exe
            dist/SHA256SUMS.txt
