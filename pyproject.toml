[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chrome-diagnostic-windows"
version = "1.0.0"
description = "Privacy-first Windows diagnostic utility for Chrome startup performance and WHEA/PCIe warnings."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Chrome Diagnostic contributors"}]
dependencies = ["psutil>=6.0,<8"]
keywords = ["chrome", "windows", "diagnostics", "cpu", "whea", "pcie", "performance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]

[project.scripts]
chrome-diagnostic = "chrome_diagnostic.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
